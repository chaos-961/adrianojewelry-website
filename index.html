<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) resolve on iOS. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Adriano Jewelry — Custom Design, Repair and Restoration in Boston</title>
    <meta
      name="description"
      content="Twenty-three years at the bench. Custom pieces made from a drawing, repairs, and heirloom restoration at 333 Washington Street, Boston. Trained in Europe, working in America."
    />
    <link rel="canonical" href="https://adrianojewelry.com/" />

    <!-- Matches the page ground the site paints, so the browser chrome on a
         phone does not sit against a colour the page never uses. Moved with the
         palette when it went light — leave it on --paper, not on the footer's
         --paper-sunk, because the top of the page is what this meets. -->
    <meta name="theme-color" content="#f4f4f4" />
    <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Adriano Jewelry" />
    <meta property="og:title" content="Adriano Jewelry — every piece begins as a drawing" />
    <meta
      property="og:description"
      content="Twenty-three years at the bench in Boston. Custom design, repair and heirloom restoration, by hand."
    />
    <meta property="og:url" content="https://adrianojewelry.com/" />
    <meta property="og:image" content="https://adrianojewelry.com/assets/img/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Adriano Jewelry" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- site.css is the shared shell every page loads; home.css styles only
         the stage below and is loaded by this page alone. home.js is the one
         piece of external JavaScript on the site: it renders the Adriano ring
         box live on this page, on a fresh copy of three.js 0.185.1 vendored in
         assets/js/vendor/ straight from the npm registry. All of it is new
         work — nothing here is recovered from the v0.1.4 viewer or the
         v0.1.8-v0.2.0 scroll film that stood on this page before it was
         emptied in v0.2.1. -->
    <link rel="stylesheet" href="assets/css/site.css" />
    <link rel="stylesheet" href="assets/css/home.css" />

    <!-- The module graph is three levels deep (home.js -> models/ring-box.js
         + models/geometry.js -> vendor three); preloading flattens the chain
         so the render is not rounds of trips behind the parse. -->
    <link rel="modulepreload" href="assets/js/home.js" />
    <link rel="modulepreload" href="assets/js/models/ring-box.js" />
    <link rel="modulepreload" href="assets/js/models/geometry.js" />
    <link rel="modulepreload" href="assets/js/vendor/three.module.min.js" />
    <link rel="modulepreload" href="assets/js/vendor/three.core.min.js" />
    <script type="module" src="assets/js/home.js"></script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "JewelryStore",
        "name": "Adriano Jewelry",
        "description": "Custom jewelry design, repair and heirloom restoration. Twenty-three years at the bench, trained in Europe.",
        "url": "https://adrianojewelry.com/",
        "image": "https://adrianojewelry.com/assets/img/adriano-900.jpg",
        "telephone": "+1-857-991-1679",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "333 Washington Street",
          "addressLocality": "Boston",
          "addressRegion": "MA",
          "postalCode": "02108",
          "addressCountry": "US"
        },
        "sameAs": [
          "https://www.instagram.com/adrianojewelry",
          "https://www.facebook.com/profile.php?id=100095448876299"
        ]
      }
    </script>
  </head>
  <body>
    <!-- The page holds one thing: the store's ring box, modelled and rendered
         live in the browser by home.js — the black lidded box with the lamp in
         its lid, the Adriano marque inlaid on top, and no ring inside it. Drag
         turns it; the two pills work the lid and the lamp. There is still no
         header bar — "the footer only" was that instruction, and nothing above
         this section has returned — so build.js goes on reporting its expected
         "no header region" warning on every run.

         Everything inside .stage is display:none until the script stands the
         scene up, so with JavaScript off this page is exactly what v0.2.1
         shipped: the ground, the footer, nothing else. The buttons are typed
         out here rather than created by script so the markup is honest about
         what the page can do — the script only ever toggles their labels. -->
    <main class="page" aria-label="Adriano Jewelry">
      <section class="stage" aria-label="The Adriano ring box">
        <div class="stage__frame">
          <canvas
            class="stage__canvas"
            id="stage-canvas"
            tabindex="0"
            role="img"
            aria-label="A black Adriano Jewelry ring box, rendered live. Drag to turn it; the buttons below open the lid and work its lamp."
          ></canvas>
          <div class="stage__vignette" aria-hidden="true"></div>
          <p class="stage__fallback" id="stage-fallback" hidden>
            The ring box on this page is rendered live in your browser, and this
            browser has WebGL switched off.
          </p>
        </div>
        <p class="stage__hint" id="stage-hint">Drag the box to turn it</p>
        <div class="stage__controls">
          <button type="button" class="stage__btn u-caps" id="stage-lid">
            Open the box
          </button>
          <button type="button" class="stage__btn u-caps" id="stage-led">
            Turn on the light
          </button>
        </div>
      </section>
    </main>

    <!-- @partial footer -->
    <footer class="site-footer">
      <div class="site-footer__inner">
        <div class="site-social">
          <span class="site-social__rule" aria-hidden="true"></span>
          <nav class="site-social__links" aria-label="Adriano Jewelry on social media">
            <a
              class="site-social__link"
              href="https://www.facebook.com/profile.php?id=100095448876299"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="Adriano Jewelry on Facebook"
            >
              <svg viewBox="0 0 320 512" aria-hidden="true" focusable="false">
                <path d="M80 299.3V512h116V299.3h86.5l18-97.8H196v-33.3c0-51.6 20.2-71.8 72.5-71.8 16.3 0 29.4.4 37 1.2V7.9C291.4 4 256.4 0 236.2 0 129.3 0 80 50.5 80 159.4v42.1H14v97.8h66z"/>
              </svg>
            </a>
            <a
              class="site-social__link"
              href="https://www.instagram.com/adrianojewelry"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="Adriano Jewelry on Instagram"
            >
              <svg viewBox="0 0 448 512" aria-hidden="true" focusable="false">
                <path d="M224.1 141c-63.6 0-114.9 51.3-114.9 114.9s51.3 114.9 114.9 114.9S339 319.5 339 255.9 287.7 141 224.1 141zm0 189.6c-41.1 0-74.7-33.5-74.7-74.7s33.5-74.7 74.7-74.7 74.7 33.5 74.7 74.7-33.6 74.7-74.7 74.7zm146.4-194.3c0 14.9-12 26.8-26.8 26.8-14.9 0-26.8-12-26.8-26.8s12-26.8 26.8-26.8 26.8 12 26.8 26.8zm76.1 27.2c-1.7-35.9-9.9-67.7-36.2-93.9-26.2-26.2-58-34.4-93.9-36.2-37-2.1-147.9-2.1-184.9 0-35.8 1.7-67.6 9.9-93.9 36.1s-34.4 58-36.2 93.9c-2.1 37-2.1 147.9 0 184.9 1.7 35.9 9.9 67.7 36.2 93.9s58 34.4 93.9 36.2c37 2.1 147.9 2.1 184.9 0 35.9-1.7 67.7-9.9 93.9-36.2 26.2-26.2 34.4-58 36.2-93.9 2.1-37 2.1-147.8 0-184.8zM398.8 388c-7.8 19.6-22.9 34.7-42.6 42.6-29.5 11.7-99.5 9-132.1 9s-102.7 2.6-132.1-9c-19.6-7.8-34.7-22.9-42.6-42.6-11.7-29.5-9-99.5-9-132.1s-2.6-102.7 9-132.1c7.8-19.6 22.9-34.7 42.6-42.6 29.5-11.7 99.5-9 132.1-9s102.7-2.6 132.1 9c19.6 7.8 34.7 22.9 42.6 42.6 11.7 29.5 9 99.5 9 132.1s2.7 102.7-9 132.1z"/>
              </svg>
            </a>
          </nav>
          <span class="site-social__rule" aria-hidden="true"></span>
        </div>

        <nav class="site-footer__nav" aria-label="Legal">
          <a class="site-footer__link u-caps" href="terms-and-conditions/"
            >Terms &amp; Conditions</a
          >
          <a class="site-footer__link u-caps" href="privacy-policy/"
            >Privacy Policy</a
          >
        </nav>

        <div class="site-footer__meta">
          <p class="site-footer__version"><span class="site-footer__v">v</span>0.2.3</p>
          <!-- The year is authored here as a literal and corrected at runtime by
               the script below. Stamping it from Date() at build time instead would
               make `build.js --check` fail every New Year's Day and block the
               deploy until somebody rebuilt; deriving it only in script would show
               nothing at all with JavaScript off. This way the markup is always
               complete, the check never drifts, and every visitor with scripting on
               sees the true year. -->
          <p class="site-footer__copy">
            Copyright &copy; <span data-year>2026</span> Adriano Jewelry - All Rights
            Reserved.
          </p>
        </div>
      </div>
      <!-- Inline rather than assets/js/year.js, which this partial used to load.
           The site is now plain HTML and CSS with no external script anywhere, so
           every page opens correctly straight off the filesystem — a file:// page
           fetches no .js at all. Four lines carried in the markup cost less than a
           request, and the DOM is left untouched for the whole of the year the
           page was last built in. -->
      <script>
        (function () {
          "use strict";
          var now = String(new Date().getFullYear());
          var nodes = document.querySelectorAll("[data-year]");
          for (var i = 0; i < nodes.length; i++) {
            if (nodes[i].textContent !== now) nodes[i].textContent = now;
          }
        })();
      </script>
    </footer>
    <!-- @end footer -->

  </body>
</html>
