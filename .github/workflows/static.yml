name: Deploy static site to GitHub Pages

on:
  # Every push to the default branch publishes.
  push:
    branches: ["main"]
  # ...and it can always be re-run by hand from the Actions tab.
  workflow_dispatch:

# Least privilege: read the repo, mint a Pages deployment, sign it with OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. Queued runs are not cancelled, so a rapid series
# of pushes still ends with the newest commit live.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # No build step: the repository root is the site. Uploading "." keeps
      # 404.html, assets/ and .nojekyll exactly where the browser expects them.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
