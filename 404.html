<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Page not found — Adriano Jewelry</title>
    <!-- Styles are inlined: GitHub Pages serves this file for a miss at any
         path depth, so a relative stylesheet link would not resolve.
         Keep in sync with assets/css/site.css. -->
    <style>
      *,
      *::before,
      *::after { box-sizing: border-box; }

      html {
        height: 100%;
        -webkit-text-size-adjust: 100%;
      }

      body {
        margin: 0;
        min-height: 100%;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        background: #ffffff;
        color: #1a1a1a;
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        font-size: 16px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }

      .page {
        flex: 1 0 auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        padding: clamp(2rem, 8vw, 3rem) 1.25rem;
        text-align: center;
      }

      .notfound__code {
        margin: 0;
        font-size: clamp(2.75rem, 12vw, 4rem);
        font-weight: 600;
        letter-spacing: 0.06em;
        line-height: 1;
      }

      .notfound__message { margin: 0; color: #555555; }

      .notfound__home { margin-top: 1rem; }

      .site-footer {
        position: relative;
        flex-shrink: 0;
        background: linear-gradient(180deg, #3c3c3c 0%, #333333 100%);
        color: #d6d6d6;
        padding: 0.85rem 1rem;
        padding-right: max(1rem, env(safe-area-inset-right));
        padding-bottom: max(0.85rem, env(safe-area-inset-bottom));
        padding-left: max(1rem, env(safe-area-inset-left));
      }

      .site-footer::before {
        content: "";
        position: absolute;
        inset: 0 0 auto 0;
        height: 1px;
        background: linear-gradient(
          90deg,
          transparent 0%,
          rgba(255, 255, 255, 0.09) 18%,
          rgba(255, 255, 255, 0.09) 82%,
          transparent 100%
        );
      }

      .site-footer__inner {
        display: flex;
        align-items: center;
      }

      .site-footer__version {
        margin: 0;
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        font-size: 0.75rem;
        font-weight: 500;
        letter-spacing: 0.11em;
        color: #9d9d9d;
        font-variant-numeric: tabular-nums;
      }

      .site-footer__v {
        font-style: italic;
        font-weight: 700;
        color: #d6d6d6;
        padding-right: 0.06em;
      }

      @media (max-width: 480px) {
        .site-footer {
          padding-right: max(0.75rem, env(safe-area-inset-right));
          padding-left: max(0.75rem, env(safe-area-inset-left));
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <p class="notfound__code">404</p>
      <p class="notfound__message">This page doesn't exist.</p>
      <p class="notfound__home"><a id="home-link" href="/">Back to the home page</a></p>
    </main>

    <footer class="site-footer">
      <div class="site-footer__inner">
        <p class="site-footer__version"><span class="site-footer__v">v</span>0.0.2</p>
      </div>
    </footer>

    <script>
      // On a github.io project page the site root is /<repo>/, not /.
      if (location.hostname.endsWith("github.io")) {
        var repo = location.pathname.split("/")[1];
        if (repo) document.getElementById("home-link").href = "/" + repo + "/";
      }
    </script>
  </body>
</html>
