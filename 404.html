<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) resolve on iOS. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Page not found | Adriano Jewelry</title>
    <!-- A miss is not a destination. Pages serves this file for any unmatched
         path, so without this a crawler can index dozens of dead URLs under
         one page's content. robots.txt deliberately leaves this path
         crawlable so this directive can actually be read, at every depth the
         file gets served for. -->
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#050506" />
    <!-- Root-absolute like everything else here: Pages serves this file for a
         miss at any depth, so a relative icon href would resolve against
         whatever path was missed. -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="/assets/img/favicon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png" />
    <!-- Styles are inlined: GitHub Pages serves this file for a miss at any
         path depth, so a relative stylesheet link would not resolve.
         Keep the ground, the silver and the footer in sync with
         assets/css/site.css. -->
    <style>
      @font-face {
  font-family: "Instrument Serif";
  src: url("/assets/fonts/instrument-serif-400.woff2") format("woff2");
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}
      @font-face {
  font-family: "Archivo";
  src: url("/assets/fonts/archivo-var.woff2") format("woff2-variations");
  font-weight: 300 600;
  font-style: normal;
  font-display: swap;
}
      @font-face {
  font-family: "Chivo Mono";
  src: url("/assets/fonts/chivo-mono-var.woff2") format("woff2-variations");
  font-weight: 400 500;
  font-style: normal;
  font-display: swap;
}

      :root {
        /* Mirrors assets/css/site.css, which this page cannot link because it
           is served at any depth. Two steps of one grey over black silk: the
           ink the page is set on, and the footer one stop UP from it. Keep
           these in step with --paper and --paper-sunk over there, and mirror
           the contrast arithmetic in that file's CONTRAST FLOOR note, which is
           where the ratios for this ramp are recorded, including the ones
           measured against the silk's brightest patch rather than its average.
           White, black and grey only: every value here has R, G and B equal. */
        --ground-page: #050506;
        --ground-footer: rgba(10, 10, 11, 0.82);
        --page-fg: #ececec;
        --page-muted: #c9c9c9;
        --footer-fg: #ececec;
        --footer-rule: rgba(236, 236, 236, 0.16);
        --accent: #ececec;
        --accent-dim: rgba(236, 236, 236, 0.38);
        --pewter: #c9c9c9;
        --pewter-strong: #ffffff;
        --pewter-dim: rgba(236, 236, 236, 0.42);
        --pewter-wash: rgba(10, 10, 11, 0.62);
        --velvet-a: 0.5;
        --caps-track: 0.15em;
        /* See site.css: cancels the descender space that pushes all-caps text
           high inside a flex-centred pill. Raised from 0.03em to the measured
           0.08em in v0.1.6; the old figure came from wrong Archivo metrics
           and left every caps label sitting high. */
        --caps-drop: 0.08em;
        --font-body: "Archivo", "Helvetica Neue", Helvetica, Arial, sans-serif;
        --font-display: "Instrument Serif", Georgia, "Times New Roman", serif;
        --font-mono: "Chivo Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      *,
      *::before,
      *::after { box-sizing: border-box; }

      html {
        height: 100%;
        -webkit-text-size-adjust: 100%;
        color-scheme: dark;
        background-color: var(--ground-page);
      }

      body {
        margin: 0;
        min-height: 100%;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        color: var(--page-fg);
        font-family: var(--font-body);
        font-size: 16px;
        /* 400, and no -webkit-font-smoothing: see the note on body in
           assets/css/site.css. Both are the optical correction for setting
           light type on a dark ground rather than the other way round. */
        font-weight: 300;
        -webkit-font-smoothing: antialiased;
        line-height: 1.5;
      }

      /* Fixed ground layer, not a body background: a background on <body> is
         sized against the root box, which is one viewport tall, so anything
         sized with `cover` stopped dead at 100vh and left a visible seam. The
         ground is one flat colour now and could not seam. It is the base coat
         under the silk, and the ground a device with no WebGL keeps for good.
         See assets/css/site.css. */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -2;
        background-color: var(--ground-page);
        pointer-events: none;
      }

      /* The silk, mirrored from site.css. /assets/js/velvet.js is linked
         root-absolute for the same reason the icons and the @font-face urls
         above are: this page is served for a miss at any depth, so a relative
         src would resolve against whatever path was missed. */
      .velvet {
        position: fixed;
        inset: 0;
        z-index: -1;
        overflow: hidden;
        pointer-events: none;
        opacity: var(--velvet-a);
        background-color: var(--ground-page);
      }

      .velvet canvas {
        display: block;
        width: 100%;
        height: 100%;
        opacity: 0;
        transition: opacity 1.1s cubic-bezier(0.22, 0.8, 0.3, 1);
      }

      .velvet canvas.is-on {
        opacity: 1;
      }

      .velvet.is-painted-flat {
        background-image: radial-gradient(
            120% 42% at 24% 8%,
            rgba(255, 255, 255, 0.13),
            rgba(255, 255, 255, 0) 62%
          ),
          radial-gradient(
            90% 30% at 78% 34%,
            rgba(255, 255, 255, 0.09),
            rgba(255, 255, 255, 0) 60%
          ),
          linear-gradient(
            168deg,
            #121212,
            #050505 32%,
            #191919 55%,
            #060606 78%,
            #131313
          );
      }

      .page {
        flex: 1 0 auto;
        display: flex;
        flex-direction: column;
      }

      /* Horizontal and vertical correction for tracked all-caps labels: see
         the .u-caps note in assets/css/site.css. */
      .u-caps {
        letter-spacing: var(--caps-track);
        text-transform: uppercase;
        text-indent: var(--caps-track);
        line-height: 1;
      }

      .page-top {
        display: flex;
        justify-content: flex-end;
        padding: clamp(1rem, 3.5vw, 1.75rem)
          max(1rem, env(safe-area-inset-right)) 0
          max(1rem, env(safe-area-inset-left));
      }

      .page-contact {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        min-height: 44px;
        padding: calc(0.5rem + var(--caps-drop))
          clamp(1rem, 3.5vw, 1.45rem) calc(0.5rem - var(--caps-drop));
        border: 1px solid var(--pewter-dim);
        border-radius: 999px;
        color: var(--pewter);
        font-size: clamp(0.68rem, 2.5vw, 0.74rem);
        font-weight: 400;
        text-decoration: none;
        white-space: nowrap;
        background: var(--pewter-wash);
        transition: border-color 0.25s ease, background-color 0.25s ease,
          color 0.25s ease, box-shadow 0.25s ease;
      }

      .page-contact:hover,
      .page-contact:focus-visible {
        border-color: var(--pewter);
        background-image: linear-gradient(
          rgba(236, 236, 236, 0.14),
          rgba(236, 236, 236, 0.14)
        );
        color: var(--pewter-strong);
        box-shadow: 0 0 0 1px rgba(236, 236, 236, 0.2);
      }

      .page-contact:active {
        transform: translateY(1px);
      }

      /* Takes the space the contact bar leaves and centres the 404 in it, so
         the numerals stay optically centred rather than pushed down by the
         bar's height. */
      .page__center {
        flex: 1 0 auto;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: clamp(2rem, 7vw, 4rem) 1.25rem clamp(2.5rem, 9vw, 5rem);
      }

      .notfound {
        width: 100%;
        max-width: 34rem;
        text-align: center;
      }

      .notfound__code {
        margin: 0;
        /* Cormorant is the display face everywhere else, but it sets old-style
           figures: its 0 sits at x-height while the 4s drop below the
           baseline, so "404" reads as a low-high-low stagger. Times keeps all
           three numerals on one lining height; lining-nums is the belt and
           braces for any stack that falls through to a face with both sets. */
        font-family: var(--font-display);
        font-variant-numeric: lining-nums;
        font-feature-settings: "lnum" 1, "onum" 0;
        /* Scales with the viewport instead of overflowing a 320px phone. */
        font-size: clamp(4rem, 19vw, 8.5rem);
        font-weight: 400;
        line-height: 0.9;
        letter-spacing: 0.02em;
        color: var(--accent);
      }

      /* Brushed-silver sheen across the numerals: a four-stop rake with the
         highlight at the top of the ramp and the body of the stroke below the
         accent, so the figures read as metal standing on the cloth rather than
         as flat type. Gated on support, because `color: transparent` without a
         working text clip renders nothing at all; the flat accent above stays
         the fallback. */
      @supports (-webkit-background-clip: text) or (background-clip: text) {
        .notfound__code {
          color: transparent;
          background-image: linear-gradient(
            170deg,
            #ffffff 0%,
            var(--accent) 38%,
            #6f6f6f 62%,
            #d8d8d8 100%
          );
          -webkit-background-clip: text;
          background-clip: text;
        }
      }

      /* A short rule under the numerals, echoing the footer hairline. */
      .notfound__rule {
        width: 3.5rem;
        height: 1px;
        margin: clamp(1.25rem, 4vw, 1.75rem) auto;
        border: 0;
        background: linear-gradient(90deg, transparent, var(--accent-dim), transparent);
      }

      .notfound__title {
        margin: 0 0 0.6rem;
        font-family: var(--font-display);
        font-size: clamp(1.45rem, 5vw, 1.9rem);
        font-weight: 400;
        letter-spacing: 0.03em;
        color: var(--page-fg);
      }

      .notfound__message {
        margin: 0 auto;
        max-width: 26rem;
        color: var(--page-muted);
        font-size: 0.95rem;
      }

      .notfound__home {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.55rem;
        /* 48px floor keeps it a comfortable tap target on a phone. */
        min-height: 48px;
        margin-top: clamp(1.75rem, 5vw, 2.5rem);
        /* The caps drop goes on the pill, not the label, so the arrow beside
           it moves by the same amount. */
        padding: calc(0.7rem + var(--caps-drop)) 1.6rem
          calc(0.7rem - var(--caps-drop));
        border: 1px solid var(--accent-dim);
        border-radius: 999px;
        color: var(--accent);
        font-size: 0.8rem;
        text-decoration: none;
        background: rgba(10, 10, 11, 0.55);
        transition: border-color 0.25s ease, background-color 0.25s ease,
          color 0.25s ease;
      }

      .notfound__home:hover,
      .notfound__home:focus-visible {
        border-color: var(--accent);
        background-image: linear-gradient(
          rgba(236, 236, 236, 0.12),
          rgba(236, 236, 236, 0.12)
        );
        color: #ffffff;
      }

      .notfound__home:active {
        transform: translateY(1px);
      }

      /* The arrow slides on hover; it is decorative, so it is hidden from
         assistive tech rather than read out as a character. */
      .notfound__arrow {
        transition: transform 0.25s ease;
      }

      .notfound__home:hover .notfound__arrow {
        transform: translateX(-3px);
      }

      :focus-visible {
        outline: 2px solid var(--pewter);
        outline-offset: 3px;
      }

      /* The footer takes the raised grey; the page keeps the darker one, and
         the step between them is what separates the two. */
      .site-footer {
        position: relative;
        flex-shrink: 0;
        background-color: var(--ground-footer);
        background-image: none;
        color: var(--footer-fg);
        /* Open at the top, tight at the bottom and the walls, so the version
           sits into the corner. The bottom still clears the iPhone home
           indicator when there is one. */
        padding: clamp(1.5rem, 4vw, 2rem)
          max(0.85rem, env(safe-area-inset-right))
          max(0.7rem, env(safe-area-inset-bottom))
          max(0.85rem, env(safe-area-inset-left));
      }

      .site-footer::before {
        content: "";
        position: absolute;
        inset: 0 0 auto 0;
        height: 1px;
        background: linear-gradient(
          90deg,
          transparent 0%,
          var(--footer-rule) 18%,
          var(--footer-rule) 82%,
          transparent 100%
        );
      }

      /* Rows spaced with margins, not one grid gap: the meta line is a
         footnote to the blocks above and sits tighter to them. */
      .site-footer__inner {
        display: grid;
        justify-items: center;
        text-align: center;
      }

      .site-social {
        display: flex;
        align-items: center;
        justify-content: center;
        /* One value for the whole cluster, so disc-to-disc matches
           disc-to-rule exactly. */
        gap: var(--social-gap, 0.75rem);
        width: 100%;
        max-width: 22rem;
      }

      .site-social__rule {
        flex: 1 1 0;
        max-width: 5rem;
        height: 1px;
        background: linear-gradient(90deg, transparent, var(--pewter-dim));
      }

      .site-social__rule:last-child {
        background: linear-gradient(90deg, var(--pewter-dim), transparent);
      }

      .site-social__links {
        display: flex;
        gap: var(--social-gap, 0.75rem);
      }

      .site-social__link {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 44px;
        height: 44px;
        border: 1px solid var(--pewter-dim);
        border-radius: 50%;
        color: var(--pewter);
        background: var(--pewter-wash);
        transition: border-color 0.25s ease, background-color 0.25s ease,
          color 0.25s ease, box-shadow 0.25s ease, transform 0.25s ease;
      }

      .site-social__link svg {
        width: 15px;
        height: 15px;
        fill: currentColor;
        transition: transform 0.25s ease;
      }

      .site-social__link:hover,
      .site-social__link:focus-visible {
        border-color: var(--pewter);
        background-image: linear-gradient(
          rgba(236, 236, 236, 0.14),
          rgba(236, 236, 236, 0.14)
        );
        color: var(--pewter-strong);
        box-shadow: 0 0 0 1px rgba(236, 236, 236, 0.24),
          0 4px 18px rgba(236, 236, 236, 0.1);
      }

      .site-social__link:hover svg,
      .site-social__link:focus-visible svg {
        transform: scale(1.08);
      }

      .site-social__link:active {
        transform: translateY(1px);
      }

      .site-footer__nav {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.6rem 0.75rem;
        margin-top: clamp(1.05rem, 3vw, 1.4rem);
      }

      .site-footer__link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: calc(0.5rem + var(--caps-drop))
          clamp(0.9rem, 3.5vw, 1.35rem) calc(0.5rem - var(--caps-drop));
        border: 1px solid var(--pewter-dim);
        border-radius: 999px;
        color: var(--pewter);
        font-size: clamp(0.66rem, 2.4vw, 0.72rem);
        font-weight: 400;
        text-decoration: none;
        white-space: nowrap;
        background: var(--pewter-wash);
        transition: border-color 0.25s ease, background-color 0.25s ease,
          color 0.25s ease;
      }

      .site-footer__link:hover,
      .site-footer__link:focus-visible {
        border-color: var(--pewter);
        background-image: linear-gradient(
          rgba(236, 236, 236, 0.14),
          rgba(236, 236, 236, 0.14)
        );
        color: var(--pewter-strong);
      }

      .site-footer__link:active {
        transform: translateY(1px);
      }

      /* Three columns, the outer two equal and flexible with only the left one
         filled: the empty right column is what holds the copyright on the
         footer's true centre line rather than centring it in the space the
         version leaves over. */
      .site-footer__meta {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 0.6rem 1rem;
        width: 100%;
        margin-top: clamp(0.95rem, 2.5vw, 1.2rem);
      }

      .site-footer__copy {
        margin: 0;
        color: var(--page-muted);
        font-size: clamp(0.7rem, 2.5vw, 0.78rem);
        letter-spacing: 0.045em;
        text-align: center;
      }

      .site-footer__version {
        justify-self: start;
        margin: 0;
        font-family: var(--font-mono);
        font-size: 0.75rem;
        font-weight: 500;
        letter-spacing: 0.11em;
        color: var(--footer-fg);
        font-variant-numeric: tabular-nums;
      }

      .site-footer__v {
        font-style: italic;
        font-weight: 700;
        color: inherit;
        padding-right: 0.06em;
      }

      @media (max-width: 480px) {
        .site-footer {
          padding-right: max(0.7rem, env(safe-area-inset-right));
          padding-left: max(0.7rem, env(safe-area-inset-left));
        }

        .page-top {
          padding-right: max(0.75rem, env(safe-area-inset-right));
          padding-left: max(0.75rem, env(safe-area-inset-left));
        }
      }

      /* Too narrow for the copyright to be centred on the page with the version
         beside it: it drops to its own line and the version keeps the wall. */
      @media (max-width: 30em) {
        .site-footer__meta {
          grid-template-columns: 1fr;
          gap: 0.75rem;
        }

        .site-footer__copy {
          order: -1;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition-duration: 0.01ms !important;
          animation-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <!-- @partial top -->
      <div class="page-top">
        <a class="page-contact u-caps" href="/contact-us/" data-root-link="contact-us/">Contact Us</a>
      </div>
      <!-- @end top -->

      <div class="page__center">
        <div class="notfound">
          <p class="notfound__code">404</p>
          <hr class="notfound__rule" />
          <h1 class="notfound__title">This page doesn't exist</h1>
          <p class="notfound__message">
            The link may be out of date, or the address mistyped.
          </p>
          <a class="notfound__home" id="home-link" href="/">
            <span class="notfound__arrow" aria-hidden="true">&#8592;</span>
            <span class="u-caps">Return to the site</span>
          </a>
        </div>
      </div>
    </main>

    <!-- @partial footer -->
    <!-- THE GROUND, stamped into every page from here.

         It lives in the footer partial rather than in a region of its own because
         the footer is the one slot every page on the site fills, index.html
         included, and the site's rule is that shared chrome is authored once. Its
         position in the markup does not matter: the layer is fixed and sits at
         z-index -1, behind everything, whatever order it is declared in.

         assets/js/velvet.js paints the silk into this element ONCE and then throws
         its WebGL context away. It is deferred, so it never blocks the parse and
         never competes with the landing film's own module for the main thread
         while the loader is up. With scripting off, or on a device with no WebGL,
         this div stays empty and every page stands on the flat --paper underneath
         it, which is the ground the site shipped before v0.3.7 and is complete on
         its own. -->
    <div class="velvet" id="velvet" aria-hidden="true"></div>
    <script src="/assets/js/velvet.js" defer></script>

    <footer class="site-footer">

        <nav class="site-footer__nav" aria-label="Legal">
          <a class="site-footer__link u-caps" href="/terms-and-conditions/" data-root-link="terms-and-conditions/"
            >Terms &amp; Conditions</a
          >
          <a class="site-footer__link u-caps" href="/privacy-policy/" data-root-link="privacy-policy/"
            >Privacy Policy</a
          >
        </nav>

        <div class="site-footer__meta">
          <p class="site-footer__version"><span class="site-footer__v">v</span>0.4.6</p>
          <!-- The year is authored here as a literal and corrected at runtime by
               the script below. Stamping it from Date() at build time instead would
               make `build.js --check` fail every New Year's Day and block the
               deploy until somebody rebuilt; deriving it only in script would show
               nothing at all with JavaScript off. This way the markup is always
               complete, the check never drifts, and every visitor with scripting on
               sees the true year. -->
          <p class="site-footer__copy">
            Copyright &copy; <span data-year>2026</span> Adriano Jewelry. All Rights
            Reserved.
          </p>
        </div>
      </div>
      <!-- Inline rather than assets/js/year.js, which this partial used to load.
           Every inner page is plain HTML and CSS with no external script, so each
           opens correctly straight off the filesystem: a file:// page fetches no
           .js at all (the landing page alone loads its renderer, and hides all of
           it when scripting is off). Four lines carried in the markup cost less than a
           request, and the DOM is left untouched for the whole of the year the
           page was last built in. -->
      <script>
        (function () {
          "use strict";
          var now = String(new Date().getFullYear());
          var nodes = document.querySelectorAll("[data-year]");
          for (var i = 0; i < nodes.length; i++) {
            if (nodes[i].textContent !== now) nodes[i].textContent = now;
          }
        })();
      </script>
    </footer>
    <!-- @end footer -->

    <script>
      // On a github.io project page the site root is /<repo>/, not /.
      (function () {
        var root = "/";
        if (location.hostname.endsWith("github.io")) {
          var repo = location.pathname.split("/")[1];
          if (repo) root = "/" + repo + "/";
        }
        document.getElementById("home-link").href = root;
        var links = document.querySelectorAll("[data-root-link]");
        for (var i = 0; i < links.length; i++) {
          links[i].href = root + links[i].getAttribute("data-root-link");
        }
      })();
    </script>
  </body>
</html>
