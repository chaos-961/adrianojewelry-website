<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) resolve on iOS. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Page not found — Adriano Jewelry</title>
    <!-- Styles are inlined: GitHub Pages serves this file for a miss at any
         path depth, so a relative stylesheet link would not resolve.
         Keep the ground, the silver and the footer in sync with
         assets/css/site.css. -->
    <style>
      @font-face {
  font-family: "Instrument Serif";
  src: url("/assets/fonts/instrument-serif-400.woff2") format("woff2");
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}
      @font-face {
  font-family: "Archivo";
  src: url("/assets/fonts/archivo-var.woff2") format("woff2-variations");
  font-weight: 300 600;
  font-style: normal;
  font-display: swap;
}
      @font-face {
  font-family: "Chivo Mono";
  src: url("/assets/fonts/chivo-mono-var.woff2") format("woff2-variations");
  font-weight: 400 500;
  font-style: normal;
  font-display: swap;
}

      :root {
        /* Mirrors assets/css/site.css, which this page cannot link because it
           is served at any depth. Two flat steps of one grey: the paper the
           page is set on, and the footer one stop DOWN from it — keep these in
           step with --paper and --paper-sunk over there, and mirror the
           contrast arithmetic in that file's CONTRAST FLOOR note, which is
           where the ratios for this ramp are recorded. White, black and grey
           only: every value here has R, G and B equal. */
        --ground-page: #f4f4f4;
        --ground-footer: #e8e8e8;
        --page-fg: #1a1a1a;
        --page-muted: #5c5c5c;
        --footer-fg: #1a1a1a;
        --footer-rule: rgba(26, 26, 26, 0.18);
        --accent: #1a1a1a;
        --accent-dim: rgba(26, 26, 26, 0.5);
        --pewter: #3a3a3a;
        --pewter-strong: #000000;
        --pewter-dim: rgba(26, 26, 26, 0.55);
        --pewter-wash: rgba(26, 26, 26, 0.05);
        --caps-track: 0.15em;
        /* See site.css: cancels the descender space that pushes all-caps text
           high inside a flex-centred pill. Raised from 0.03em to the measured
           0.08em in v0.1.6 — the old figure came from wrong Archivo metrics
           and left every caps label sitting high. */
        --caps-drop: 0.08em;
        --font-body: "Archivo", "Helvetica Neue", Helvetica, Arial, sans-serif;
        --font-display: "Instrument Serif", Georgia, "Times New Roman", serif;
        /* Chivo Mono, same as every other page. The @font-face for it is
           declared above and was going unused here, so the version line — the
           one mono thing in the footer — rendered in Consolas on this page and
           in Chivo everywhere else. */
        --font-mono: "Chivo Mono", ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      }

      *,
      *::before,
      *::after { box-sizing: border-box; }

      html {
        height: 100%;
        -webkit-text-size-adjust: 100%;
        color-scheme: light;
        background-color: var(--ground-page);
      }

      body {
        margin: 0;
        min-height: 100%;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        color: var(--page-fg);
        font-family: var(--font-body);
        font-size: 16px;
        /* 400, and no -webkit-font-smoothing — see the note on body in
           assets/css/site.css. Both are the optical correction for setting
           dark type on a light ground rather than the other way round. */
        font-weight: 400;
        line-height: 1.5;
      }

      /* Fixed ground layer, not a body background: a background on <body> is
         sized against the root box, which is one viewport tall, so anything
         sized with `cover` stopped dead at 100vh and left a visible seam. The
         ground is one flat colour now and could not seam, but the layer stays
         so re-adding a gradient here is safe. See assets/css/site.css. */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -1;
        background-color: var(--ground-page);
        pointer-events: none;
      }

      .page {
        flex: 1 0 auto;
        display: flex;
        flex-direction: column;
      }

      /* Horizontal and vertical correction for tracked all-caps labels — see
         the .u-caps note in assets/css/site.css. */
      .u-caps {
        letter-spacing: var(--caps-track);
        text-transform: uppercase;
        text-indent: var(--caps-track);
        line-height: 1;
      }

      .page-top {
        display: flex;
        justify-content: flex-end;
        padding: clamp(1rem, 3.5vw, 1.75rem)
          max(1rem, env(safe-area-inset-right)) 0
          max(1rem, env(safe-area-inset-left));
      }

      .page-contact {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        min-height: 44px;
        padding: calc(0.5rem + var(--caps-drop))
          clamp(1rem, 3.5vw, 1.45rem) calc(0.5rem - var(--caps-drop));
        border: 1px solid var(--pewter-dim);
        border-radius: 999px;
        color: var(--pewter);
        font-size: clamp(0.68rem, 2.5vw, 0.74rem);
        font-weight: 400;
        text-decoration: none;
        white-space: nowrap;
        background: var(--pewter-wash);
        transition: border-color 0.25s ease, background-color 0.25s ease,
          color 0.25s ease, box-shadow 0.25s ease;
      }

      .page-contact:hover,
      .page-contact:focus-visible {
        border-color: var(--pewter);
        background: rgba(26, 26, 26, 0.1);
        color: var(--pewter-strong);
        box-shadow: 0 0 0 1px rgba(26, 26, 26, 0.18);
      }

      .page-contact:active {
        transform: translateY(1px);
      }

      /* Takes the space the contact bar leaves and centres the 404 in it, so
         the numerals stay optically centred rather than pushed down by the
         bar's height. */
      .page__center {
        flex: 1 0 auto;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: clamp(2rem, 7vw, 4rem) 1.25rem clamp(2.5rem, 9vw, 5rem);
      }

      .notfound {
        width: 100%;
        max-width: 34rem;
        text-align: center;
      }

      .notfound__code {
        margin: 0;
        /* Cormorant is the display face everywhere else, but it sets old-style
           figures: its 0 sits at x-height while the 4s drop below the
           baseline, so "404" reads as a low-high-low stagger. Times keeps all
           three numerals on one lining height; lining-nums is the belt and
           braces for any stack that falls through to a face with both sets. */
        font-family: var(--font-display);
        font-variant-numeric: lining-nums;
        font-feature-settings: "lnum" 1, "onum" 0;
        /* Scales with the viewport instead of overflowing a 320px phone. */
        font-size: clamp(4rem, 19vw, 8.5rem);
        font-weight: 400;
        line-height: 0.9;
        letter-spacing: 0.02em;
        color: var(--accent);
      }

      /* Brushed-graphite sheen across the numerals — the same four-stop rake
         the dark palette used, run the other way up the ramp so the highlight
         is the light step and the body of the stroke is the dark one. Gated on
         support, because `color: transparent` without a working text clip
         renders nothing at all — the flat accent above stays the fallback. */
      @supports (-webkit-background-clip: text) or (background-clip: text) {
        .notfound__code {
          color: transparent;
          background-image: linear-gradient(
            170deg,
            #000000 0%,
            var(--accent) 38%,
            #8f8f8f 62%,
            #121212 100%
          );
          -webkit-background-clip: text;
          background-clip: text;
        }
      }

      /* A short rule under the numerals, echoing the footer hairline. */
      .notfound__rule {
        width: 3.5rem;
        height: 1px;
        margin: clamp(1.25rem, 4vw, 1.75rem) auto;
        border: 0;
        background: linear-gradient(90deg, transparent, var(--accent-dim), transparent);
      }

      .notfound__title {
        margin: 0 0 0.6rem;
        font-family: var(--font-display);
        font-size: clamp(1.45rem, 5vw, 1.9rem);
        font-weight: 400;
        letter-spacing: 0.03em;
        color: var(--page-fg);
      }

      .notfound__message {
        margin: 0 auto;
        max-width: 26rem;
        color: var(--page-muted);
        font-size: 0.95rem;
      }

      .notfound__home {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.55rem;
        /* 48px floor keeps it a comfortable tap target on a phone. */
        min-height: 48px;
        margin-top: clamp(1.75rem, 5vw, 2.5rem);
        /* The caps drop goes on the pill, not the label, so the arrow beside
           it moves by the same amount. */
        padding: calc(0.7rem + var(--caps-drop)) 1.6rem
          calc(0.7rem - var(--caps-drop));
        border: 1px solid var(--accent-dim);
        border-radius: 999px;
        color: var(--accent);
        font-size: 0.8rem;
        text-decoration: none;
        background: rgba(0, 0, 0, 0.02);
        transition: border-color 0.25s ease, background-color 0.25s ease,
          color 0.25s ease;
      }

      .notfound__home:hover,
      .notfound__home:focus-visible {
        border-color: var(--accent);
        background: rgba(0, 0, 0, 0.07);
        color: #000000;
      }

      .notfound__home:active {
        transform: translateY(1px);
      }

      /* The arrow slides on hover; it is decorative, so it is hidden from
         assistive tech rather than read out as a character. */
      .notfound__arrow {
        transition: transform 0.25s ease;
      }

      .notfound__home:hover .notfound__arrow {
        transform: translateX(-3px);
      }

      :focus-visible {
        outline: 2px solid var(--pewter);
        outline-offset: 3px;
      }

      /* The footer takes the raised grey; the page keeps the darker one, and
         the step between them is what separates the two. */
      .site-footer {
        position: relative;
        flex-shrink: 0;
        background-color: var(--ground-footer);
        background-image: none;
        color: var(--footer-fg);
        /* Tight at both ends: each 44px row of the bar already carries about
           16px of blank around its ink, so this is the top-up rather than the
           whole of the space. The bottom still clears the iPhone home
           indicator when there is one. */
        padding: clamp(0.7rem, 2.2vw, 1rem)
          max(0.85rem, env(safe-area-inset-right))
          max(0.7rem, env(safe-area-inset-bottom))
          max(0.85rem, env(safe-area-inset-left));
      }

      .site-footer::before {
        content: "";
        position: absolute;
        inset: 0 0 auto 0;
        height: 1px;
        background: linear-gradient(
          90deg,
          transparent 0%,
          var(--footer-rule) 18%,
          var(--footer-rule) 82%,
          transparent 100%
        );
      }

      /* One bar and one line — see the Footer note in assets/css/site.css for
         what this replaced and why. Wide: the version at the left wall, the
         policies on the page's true centre, the marks at the right wall, with
         the copyright underneath. Narrow: the policies take a row of their own
         and the version and the marks are the bookends beneath them. */
      .site-footer__inner {
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-areas:
          "nav     nav"
          "version social"
          "copy    copy";
        align-items: center;
        column-gap: 0.75rem;
        width: 100%;
      }

      @media (min-width: 36em) {
        .site-footer__inner {
          grid-template-columns: 1fr auto 1fr;
          grid-template-areas:
            "version nav social"
            "copy    copy copy";
        }
      }

      /* Two marks and nothing else at rest; the disc is a state now, drawn
         behind one only under the pointer or on focus. */
      .site-social {
        grid-area: social;
        justify-self: end;
        display: flex;
        align-items: center;
        gap: clamp(0rem, 1vw, 0.25rem);
        /* Pulls the 15px marks back out to the wall from inside their 44px
           targets, by less than the footer's narrowest side padding. */
        margin-right: -0.55rem;
      }

      .site-social__link {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        color: var(--pewter);
        transition: color 0.25s ease, transform 0.25s ease;
      }

      .site-social__link::before {
        content: "";
        position: absolute;
        inset: 5px;
        border: 1px solid transparent;
        border-radius: 50%;
        background-color: transparent;
        transition: border-color 0.25s ease, background-color 0.25s ease;
      }

      .site-social__link:hover::before,
      .site-social__link:focus-visible::before {
        border-color: var(--pewter-dim);
        background-color: var(--pewter-wash);
      }

      .site-social__link:hover,
      .site-social__link:focus-visible {
        color: var(--pewter-strong);
      }

      .site-social__link svg {
        position: relative;
        width: 15px;
        height: 15px;
        fill: currentColor;
        transition: transform 0.25s ease;
      }

      .site-social__link:hover svg,
      .site-social__link:focus-visible svg {
        transform: scale(1.08);
      }

      .site-social__link:active {
        transform: translateY(1px);
      }

      .site-footer__nav {
        grid-area: nav;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 0 clamp(0.55rem, 2.2vw, 0.9rem);
      }

      .site-footer__sep {
        width: 1px;
        height: 0.62rem;
        background: var(--pewter-dim);
      }

      /* No pill: colour and a rule under the text carry the link, and the 44px
         min-height carries the tap target without drawing anything.
         --caps-drop still applies, split +/- across the two paddings. */
      .site-footer__link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: calc(0.4rem + var(--caps-drop)) 0.1rem
          calc(0.4rem - var(--caps-drop));
        color: var(--pewter);
        font-size: clamp(0.6rem, 2.2vw, 0.68rem);
        font-weight: 400;
        text-decoration: underline;
        text-decoration-thickness: 1px;
        text-decoration-color: var(--footer-rule);
        text-underline-offset: 0.42em;
        transition: color 0.25s ease, text-decoration-color 0.25s ease;
      }

      .site-footer__link:hover,
      .site-footer__link:focus-visible {
        color: var(--pewter-strong);
        text-decoration-color: var(--pewter);
      }

      .site-footer__link:active {
        transform: translateY(1px);
      }

      .site-footer__version {
        grid-area: version;
        justify-self: start;
        margin: 0;
        font-family: var(--font-mono);
        font-size: clamp(0.68rem, 2.2vw, 0.74rem);
        font-weight: 500;
        letter-spacing: 0.1em;
        color: var(--footer-fg);
        font-variant-numeric: tabular-nums;
        line-height: 1;
      }

      .site-footer__v {
        font-style: italic;
        font-weight: 700;
        color: inherit;
        padding-right: 0.06em;
      }

      .site-footer__copy {
        grid-area: copy;
        justify-self: center;
        margin: 0.3rem 0 0;
        color: var(--page-muted);
        font-size: clamp(0.62rem, 2.2vw, 0.72rem);
        letter-spacing: 0.04em;
        text-align: center;
      }

      @media (max-width: 480px) {
        .site-footer {
          padding-right: max(0.7rem, env(safe-area-inset-right));
          padding-left: max(0.7rem, env(safe-area-inset-left));
        }

        .page-top {
          padding-right: max(0.75rem, env(safe-area-inset-right));
          padding-left: max(0.75rem, env(safe-area-inset-left));
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition-duration: 0.01ms !important;
          animation-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <!-- @partial top -->
      <div class="page-top">
        <a class="page-contact u-caps" href="/contact-us/" data-root-link="contact-us/">Contact Us</a>
      </div>
      <!-- @end top -->

      <div class="page__center">
        <div class="notfound">
          <p class="notfound__code">404</p>
          <hr class="notfound__rule" />
          <h1 class="notfound__title">This page doesn't exist</h1>
          <p class="notfound__message">
            The link may be out of date, or the address mistyped.
          </p>
          <a class="notfound__home" id="home-link" href="/">
            <span class="notfound__arrow" aria-hidden="true">&#8592;</span>
            <span class="u-caps">Return to the site</span>
          </a>
        </div>
      </div>
    </main>

    <!-- @partial footer -->
    <footer class="site-footer">
      <div class="site-footer__inner">
        <p class="site-footer__version"><span class="site-footer__v">v</span>0.1.8</p>

        <nav class="site-footer__nav" aria-label="Legal">
          <a class="site-footer__link u-caps" href="/terms-and-conditions/" data-root-link="terms-and-conditions/"
            >Terms &amp; Conditions</a
          >
          <span class="site-footer__sep" aria-hidden="true"></span>
          <a class="site-footer__link u-caps" href="/privacy-policy/" data-root-link="privacy-policy/"
            >Privacy Policy</a
          >
        </nav>

        <nav class="site-social" aria-label="Adriano Jewelry on social media">
          <a
            class="site-social__link"
            href="https://www.facebook.com/profile.php?id=100095448876299"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Adriano Jewelry on Facebook"
          >
            <svg viewBox="0 0 320 512" aria-hidden="true" focusable="false">
              <path d="M80 299.3V512h116V299.3h86.5l18-97.8H196v-33.3c0-51.6 20.2-71.8 72.5-71.8 16.3 0 29.4.4 37 1.2V7.9C291.4 4 256.4 0 236.2 0 129.3 0 80 50.5 80 159.4v42.1H14v97.8h66z"/>
            </svg>
          </a>
          <a
            class="site-social__link"
            href="https://www.instagram.com/adrianojewelry"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Adriano Jewelry on Instagram"
          >
            <svg viewBox="0 0 448 512" aria-hidden="true" focusable="false">
              <path d="M224.1 141c-63.6 0-114.9 51.3-114.9 114.9s51.3 114.9 114.9 114.9S339 319.5 339 255.9 287.7 141 224.1 141zm0 189.6c-41.1 0-74.7-33.5-74.7-74.7s33.5-74.7 74.7-74.7 74.7 33.5 74.7 74.7-33.6 74.7-74.7 74.7zm146.4-194.3c0 14.9-12 26.8-26.8 26.8-14.9 0-26.8-12-26.8-26.8s12-26.8 26.8-26.8 26.8 12 26.8 26.8zm76.1 27.2c-1.7-35.9-9.9-67.7-36.2-93.9-26.2-26.2-58-34.4-93.9-36.2-37-2.1-147.9-2.1-184.9 0-35.8 1.7-67.6 9.9-93.9 36.1s-34.4 58-36.2 93.9c-2.1 37-2.1 147.9 0 184.9 1.7 35.9 9.9 67.7 36.2 93.9s58 34.4 93.9 36.2c37 2.1 147.9 2.1 184.9 0 35.9-1.7 67.7-9.9 93.9-36.2 26.2-26.2 34.4-58 36.2-93.9 2.1-37 2.1-147.8 0-184.8zM398.8 388c-7.8 19.6-22.9 34.7-42.6 42.6-29.5 11.7-99.5 9-132.1 9s-102.7 2.6-132.1-9c-19.6-7.8-34.7-22.9-42.6-42.6-11.7-29.5-9-99.5-9-132.1s-2.6-102.7 9-132.1c7.8-19.6 22.9-34.7 42.6-42.6 29.5-11.7 99.5-9 132.1-9s102.7-2.6 132.1 9c19.6 7.8 34.7 22.9 42.6 42.6 11.7 29.5 9 99.5 9 132.1s2.7 102.7-9 132.1z"/>
            </svg>
          </a>
        </nav>

        <!-- The year is authored here as a literal and corrected at runtime by
             the script below. Stamping it from Date() at build time instead would
             make `build.js --check` fail every New Year's Day and block the
             deploy until somebody rebuilt; deriving it only in script would show
             nothing at all with JavaScript off. This way the markup is always
             complete, the check never drifts, and every visitor with scripting on
             sees the true year. -->
        <p class="site-footer__copy">
          Copyright &copy; <span data-year>2026</span> Adriano Jewelry - All Rights
          Reserved.
        </p>
      </div>
      <!-- Inline rather than assets/js/year.js, which this partial used to load.
           The site is now plain HTML and CSS with no external script anywhere, so
           every page opens correctly straight off the filesystem — a file:// page
           fetches no .js at all. Four lines carried in the markup cost less than a
           request, and the DOM is left untouched for the whole of the year the
           page was last built in. -->
      <script>
        (function () {
          "use strict";
          var now = String(new Date().getFullYear());
          var nodes = document.querySelectorAll("[data-year]");
          for (var i = 0; i < nodes.length; i++) {
            if (nodes[i].textContent !== now) nodes[i].textContent = now;
          }
        })();
      </script>
    </footer>
    <!-- @end footer -->

    <script>
      // On a github.io project page the site root is /<repo>/, not /.
      (function () {
        var root = "/";
        if (location.hostname.endsWith("github.io")) {
          var repo = location.pathname.split("/")[1];
          if (repo) root = "/" + repo + "/";
        }
        document.getElementById("home-link").href = root;
        var links = document.querySelectorAll("[data-root-link]");
        for (var i = 0; i < links.length; i++) {
          links[i].href = root + links[i].getAttribute("data-root-link");
        }
      })();
    </script>
  </body>
</html>
