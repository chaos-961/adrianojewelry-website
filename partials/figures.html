<!-- Process drawings — one <symbol> each, referenced twice per stage by <use>
     (once in the pinned desktop plate, once inline in the mobile stage), so
     the geometry is defined exactly once.

     These are technical drawings rather than photographs, on purpose. No one
     has photographed a wax carving, a casting or a setting-in-progress for
     this shop, and generating a photograph of one would be the fabrication
     this project refuses. A drawing claims only to be a drawing — and it is
     the truer register anyway, because the trade starts on paper.

     Style rules, held across all five: one hairline weight for the subject,
     a thinner dimmer weight for construction and dimension lines, and dashes
     reserved for what is hidden or about to be removed. Colours are baked as
     attributes rather than classes because CSS selectors do not cross the
     shadow boundary that <use> creates; only inherited properties do, which is
     why the subject strokes use currentColor. -->
<svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
  <defs>
    <!-- Shared arrowhead for dimension lines. -->
    <marker id="fg-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#B8943F" />
    </marker>
  </defs>

  <!-- 01 SKETCH — the ring drawn in elevation, the way it is worked out on
       paper before anything is cut: outside diameter, band section, the stone
       sitting above the finger, and the dimension that decides all of it. -->
  <symbol id="fg-sketch" viewBox="0 0 400 400">
    <g fill="none" stroke="#B8943F" stroke-width="0.7" opacity="0.55">
      <path d="M200 40 V370" stroke-dasharray="7 6" />
      <path d="M60 250 H340" stroke-dasharray="7 6" />
      <path d="M96 330 H304" marker-start="url(#fg-ar)" marker-end="url(#fg-ar)" />
      <path d="M96 318 V342 M304 318 V342" />
    </g>
    <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">
      <circle cx="200" cy="250" r="104" />
      <circle cx="200" cy="250" r="82" />
      <!-- Round brilliant in elevation: table, crown, girdle, pavilion. -->
      <path d="M164 128 H236 L228 108 H172 Z" />
      <path d="M164 128 L200 176 L236 128" />
      <path d="M172 108 L200 128 L228 108" opacity="0.7" />
      <path d="M186 128 V108 M214 128 V108" opacity="0.7" />
      <!-- The setting bridging stone to band. -->
      <path d="M170 132 L176 152 M230 132 L224 152" />
    </g>
    <g fill="#B8943F" opacity="0.85">
      <circle cx="200" cy="250" r="2" />
    </g>
  </symbol>

  <!-- 02 WAX — the design carved at full scale. The blank is a tube; the
       dashed profile is the material about to come away, and the graver is
       shown at the angle it actually enters at. -->
  <symbol id="fg-wax" viewBox="0 0 400 400">
    <g fill="none" stroke="#B8943F" stroke-width="0.7" opacity="0.5">
      <path d="M200 46 V354" stroke-dasharray="7 6" />
      <path d="M120 300 H280" marker-start="url(#fg-ar)" marker-end="url(#fg-ar)" />
    </g>
    <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">
      <!-- Tube blank seen in slight perspective. -->
      <ellipse cx="200" cy="150" rx="80" ry="26" />
      <path d="M120 150 V236" />
      <path d="M280 150 V236" />
      <path d="M120 236 A80 26 0 0 0 280 236" />
      <ellipse cx="200" cy="150" rx="52" ry="16" opacity="0.75" />
    </g>
    <!-- Material to be removed. -->
    <g fill="none" stroke="#B8943F" stroke-width="1" stroke-dasharray="5 5" opacity="0.8">
      <path d="M148 168 Q200 196 252 168" />
    </g>
    <g stroke="#B8943F" stroke-width="0.8" opacity="0.55">
      <path d="M156 176 L166 196 M172 184 L182 204 M188 188 L198 208 M204 188 L214 208 M220 184 L230 204 M236 176 L246 196" />
    </g>
    <!-- Graver, entering low and from the right the way a hand holds it. -->
    <g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round">
      <path d="M262 132 L306 96 L330 112 L286 148 Z" opacity="0.9" />
      <path d="M262 132 L244 146" />
      <path d="M306 96 L330 112" />
    </g>
  </symbol>

  <!-- 03 CAST — the flask in section. The wax burns out of the investment and
       the void it leaves is filled; the dashed forms are the cavity, which is
       the whole point of the drawing. One mould, one piece. -->
  <symbol id="fg-cast" viewBox="0 0 400 400">
    <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">
      <!-- Flask wall. -->
      <path d="M108 118 V330 H292 V118" />
      <path d="M96 118 H304" />
      <!-- Pouring funnel. -->
      <path d="M158 118 L176 74 H224 L242 118" />
    </g>
    <g fill="none" stroke="#B8943F" stroke-width="1.1" stroke-dasharray="6 5" opacity="0.9">
      <!-- Sprue and the cavities it feeds. -->
      <path d="M200 118 V286" />
      <path d="M200 168 L152 196 M200 168 L248 196" />
      <path d="M200 232 L152 260 M200 232 L248 260" />
      <circle cx="142" cy="206" r="20" />
      <circle cx="258" cy="206" r="20" />
      <circle cx="142" cy="270" r="20" />
      <circle cx="258" cy="270" r="20" />
    </g>
    <!-- Investment texture, kept sparse so it reads as fill and not as noise. -->
    <g stroke="#B8943F" stroke-width="0.6" opacity="0.28">
      <path d="M120 140 H180 M120 170 H136 M264 140 H284 M300 170 H284 M120 240 H132 M272 300 H284 M120 300 H184 M216 320 H284" />
    </g>
    <g fill="none" stroke="#B8943F" stroke-width="0.7" opacity="0.5">
      <path d="M200 74 V56" />
      <path d="M176 62 L200 46 L224 62" />
    </g>
  </symbol>

  <!-- 04 SET — the loupe field. Stone from above inside four prongs, drawn at
       the magnification the work is actually done at. The crosshairs are the
       reticle, and the reason the caption talks about millimetres. -->
  <symbol id="fg-set" viewBox="0 0 400 400">
    <g fill="none" stroke="#B8943F" stroke-width="0.7" opacity="0.5">
      <circle cx="200" cy="200" r="150" />
      <path d="M200 36 V78 M200 322 V364 M36 200 H78 M322 200 H364" />
      <path d="M168 200 H232 M200 168 V232" stroke-dasharray="4 5" />
    </g>
    <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">
      <!-- Girdle and table. -->
      <circle cx="200" cy="200" r="96" />
      <path d="M200 132 L268 200 L200 268 L132 200 Z" />
      <!-- Crown facets. -->
      <path d="M200 132 L200 104 M268 200 L296 200 M200 268 L200 296 M132 200 L104 200" opacity="0.55" />
      <path d="M152 152 L132 200 M248 152 L268 200 M152 248 L132 200 M248 248 L268 200" opacity="0.55" />
      <path d="M200 132 L152 152 M200 132 L248 152 M200 268 L152 248 M200 268 L248 248" opacity="0.75" />
    </g>
    <!-- Four prongs, drawn bent over the girdle. -->
    <g fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round">
      <path d="M132 132 Q158 158 172 172" />
      <path d="M268 132 Q242 158 228 172" />
      <path d="M132 268 Q158 242 172 228" />
      <path d="M268 268 Q242 242 228 228" />
    </g>
  </symbol>

  <!-- 05 FINISH — the piece as it leaves the bench: filed, polished, checked,
       and in a box with a name on it. The only drawing of the five with no
       construction lines on it, because there is nothing left to work out. -->
  <symbol id="fg-finish" viewBox="0 0 400 400">
    <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">
      <!-- Box, open, seen slightly from above. -->
      <path d="M84 232 L200 268 L316 232" />
      <path d="M84 232 V300 L200 340 L316 300 V232" />
      <path d="M200 268 V340" opacity="0.6" />
      <path d="M84 232 L128 210 L244 246 L200 268 Z" opacity="0.75" />
      <path d="M316 232 L272 210 L156 246" opacity="0.35" />
    </g>
    <!-- The ring, seated. -->
    <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
      <ellipse cx="200" cy="176" rx="52" ry="54" />
      <ellipse cx="200" cy="176" rx="38" ry="40" />
      <path d="M182 122 L200 92 L218 122" />
      <path d="M186 108 H214" />
    </g>
    <!-- Two short highlights. A polished surface throws a hard edge of light,
         not a glow, so these are strokes and not a gradient. -->
    <g fill="none" stroke="#F0D89C" stroke-width="2" stroke-linecap="round" opacity="0.85">
      <path d="M166 148 Q158 176 168 202" />
      <path d="M236 160 Q240 176 236 192" opacity="0.6" />
    </g>
  </symbol>
</svg>
